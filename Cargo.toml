[package]
name = "yam"
description = "http server,router and client"
version = "0.1.0"
edition = "2024"


[workspace]
resolver = "3"
members = [".", "shared", "server", "router", "client"]

[dependencies]
yam-server = { path = "server", optional = true }
yam-router = { path = "router", optional = true }
yam-client = { path = "client", optional = true }

[dev-dependencies]
tokio = { version="1.52.3", features=["full"] }
serde ={ version= "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[features]
default = ["server", "router", "client"]
server  = ["dep:yam-server"]
router  = ["dep:yam-router", "server"]
client  = ["dep:yam-client"]