[package]
name = "yam-client"
description = "Minimal HTTP client for yam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1.52.3", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
url ="2"
serde ={ version= "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
thiserror = "2"
tokio-rustls = "0.26.4"
yam-shared = { workspace = true }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.14.10"
