[workspace]

[package]
name = "crud_api"
version = "0.1.0"
edition = "2024"

[dependencies]

diesel = { version = "2.3.10", features = ["postgres","uuid"] }
dotenv = "0.15.0"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.18"
thiserror = "2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
jsonwebtoken = { version="10.4.0", features= ["rust_crypto"]}
chrono = "0.4.45"
time = "0.3"
yam-http = { path = "../.." }
