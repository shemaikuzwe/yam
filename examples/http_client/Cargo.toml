[workspace]

[package]
name = "http_client"
version = "0.1.0"
edition = "2024"
description = "Simple yam-http client example"

[dependencies]
yam-http = { path = "../..", features = ["client"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
