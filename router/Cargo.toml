[package]
name = "yam-router"
description = "Minimal HTTP router for yam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yam-server = { workspace = true }
tokio = { version = "1.52.3", features = ["net", "macros", "rt-multi-thread"] }
matchit = "0.9.2"
tracing = "0.1.44"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
